<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" fill="none">
  <defs>
    <!-- Gradiente de Fundo Premium -->
    <linearGradient id="app-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f35" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Brilho Interno da Borda -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe82" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6fb7db" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Gradiente dos Brackets e Slash -->
    <linearGradient id="bracket-peach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd5ad" />
      <stop offset="100%" stop-color="#ff9d5c" />
    </linearGradient>

    <linearGradient id="bracket-cerulean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e4fa" />
      <stop offset="100%" stop-color="#4ea1ca" />
    </linearGradient>

    <linearGradient id="slash-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbe82" />
      <stop offset="50%" stop-color="#9FD6F2" />
      <stop offset="100%" stop-color="#6fb7db" />
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Corpo do Ícone: Squircle Ergonômico -->
  <rect x="6" y="6" width="180" height="180" rx="44" fill="url(#app-bg)" />
  <rect x="6" y="6" width="180" height="180" rx="44" stroke="url(#border-glow)" stroke-width="2.5" />

  <!-- Círculos decorativos sutis no background estilo IDE -->
  <circle cx="96" cy="96" r="62" stroke="#6fb7db" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- Emblema de Programação DualDev -->
  <g filter="url(#icon-shadow)">
    <!-- Bracket Esquerdo (<) em Pêssego Pastel -->
    <path d="M 64 68 L 40 96 L 64 124" 
          stroke="url(#bracket-peach)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Barra Diagonal Central (/) com degradê duplo -->
    <path d="M 108 58 L 84 134" 
          stroke="url(#slash-grad)" 
          stroke-width="11" 
          stroke-linecap="round" />

    <!-- Bracket Direito (>) em Cerúleo Pastel -->
    <path d="M 128 68 L 152 96 L 128 124" 
          stroke="url(#bracket-cerulean)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Ponto de pulso de terminal (cursor) -->
  <circle cx="148" cy="142" r="3.5" fill="#86efac" />
</svg>
