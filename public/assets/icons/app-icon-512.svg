<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Gradiente de Fundo Premium -->
    <linearGradient id="app-bg-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f35" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Brilho Interno da Borda -->
    <linearGradient id="border-glow-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe82" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#6fb7db" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7" />
    </linearGradient>

    <!-- Gradientes dos Elementos -->
    <linearGradient id="bracket-peach-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd5ad" />
      <stop offset="100%" stop-color="#ff9d5c" />
    </linearGradient>

    <linearGradient id="bracket-cerulean-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e4fa" />
      <stop offset="100%" stop-color="#4ea1ca" />
    </linearGradient>

    <linearGradient id="slash-grad-512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbe82" />
      <stop offset="50%" stop-color="#9FD6F2" />
      <stop offset="100%" stop-color="#6fb7db" />
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="icon-shadow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Corpo do Ícone: Squircle Ergonômico -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#app-bg-512)" />
  <rect x="16" y="16" width="480" height="480" rx="116" stroke="url(#border-glow-512)" stroke-width="6" />

  <!-- Círculos decorativos sutis no background estilo IDE -->
  <circle cx="256" cy="256" r="165" stroke="#6fb7db" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="10 14" />

  <!-- Emblema de Programação DualDev -->
  <g filter="url(#icon-shadow-512)">
    <!-- Bracket Esquerdo (<) em Pêssego Pastel -->
    <path d="M 172 180 L 108 256 L 172 332" 
          stroke="url(#bracket-peach-512)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Barra Diagonal Central (/) com degradê duplo -->
    <path d="M 288 152 L 224 360" 
          stroke="url(#slash-grad-512)" 
          stroke-width="28" 
          stroke-linecap="round" />

    <!-- Bracket Direito (>) em Cerúleo Pastel -->
    <path d="M 340 180 L 404 256 L 340 332" 
          stroke="url(#bracket-cerulean-512)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Ponto de pulso de terminal (cursor ativo) -->
  <circle cx="395" cy="380" r="9" fill="#86efac" />
</svg>
